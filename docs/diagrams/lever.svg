<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 800 460" font-family="sans-serif">
<!-- ground, bar and guide lines: not parts -->
<rect x="40" y="370" width="720" height="10" fill="#e3e5ea"/>
<line x1="40" y1="370" x2="760" y2="370" stroke="#333" stroke-width="2"/>
<g stroke="#8a8f99" stroke-width="1.5" stroke-dasharray="5 4"><line x1="140" y1="310" x2="140" y2="424"/><line x1="280" y1="382" x2="280" y2="424"/><line x1="700" y1="310" x2="700" y2="424"/></g>
<rect x="90" y="292" width="620" height="16" rx="3" fill="#c98a4b" stroke="#333" stroke-width="2"/>

<g data-part="fulcrum"><polygon points="280,309 246,369 314,369" fill="#8a8f99" stroke="#333" stroke-width="2"/><line x1="302" y1="344" x2="324" y2="344" stroke="#555" stroke-width="1"/><text x="328" y="349" font-size="16" text-anchor="start" fill="#1f2024">Pivot (fulcrum)</text></g>
<g data-part="load"><rect x="100" y="222" width="80" height="70" fill="#f1dcb4" stroke="#333" stroke-width="2"/><line x1="140" y1="80" x2="140" y2="200" stroke="#7d4fc4" stroke-width="6"/><polygon points="140,216 130,197 150,197" fill="#7d4fc4"/><line x1="140" y1="80" x2="140" y2="216" stroke="#000" stroke-opacity="0" stroke-width="18"/><text x="140" y="66" font-size="16" text-anchor="middle" fill="#1f2024">Load</text></g>
<g data-part="effort"><path d="M722,276 L770,226" fill="none" stroke="#333" stroke-width="20" stroke-linecap="round"/><path d="M722,276 L770,226" fill="none" stroke="#f0c9a0" stroke-width="16" stroke-linecap="round"/><path d="M754,243 L776,220" fill="none" stroke="#333" stroke-width="26" stroke-linecap="butt"/><path d="M756,241 L775,221" fill="none" stroke="#5b7fa6" stroke-width="22" stroke-linecap="butt"/><rect x="672" y="272" width="56" height="20" rx="10" fill="#f0c9a0" stroke="#333" stroke-width="2"/><path d="M686,273 V283 M698,273 V283 M710,273 V283" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/><line x1="700" y1="226" x2="700" y2="254" stroke="#2e9e4f" stroke-width="6"/><polygon points="700,270 690,251 710,251" fill="#2e9e4f"/><line x1="700" y1="226" x2="700" y2="270" stroke="#000" stroke-opacity="0" stroke-width="18"/><text x="700" y="212" font-size="16" text-anchor="middle" fill="#1f2024">Effort</text></g>
<g data-part="load-arm"><line x1="154" y1="410" x2="266" y2="410" stroke="#c0392b" stroke-width="4"/><polygon points="140,410 157,402 157,418" fill="#c0392b"/><polygon points="280,410 263,402 263,418" fill="#c0392b"/><line x1="140" y1="410" x2="280" y2="410" stroke="#000" stroke-opacity="0" stroke-width="20"/><text x="210" y="442" font-size="16" text-anchor="middle" fill="#1f2024">Load arm</text></g>
<g data-part="effort-arm"><line x1="294" y1="410" x2="686" y2="410" stroke="#2c6df0" stroke-width="4"/><polygon points="280,410 297,402 297,418" fill="#2c6df0"/><polygon points="700,410 683,402 683,418" fill="#2c6df0"/><line x1="280" y1="410" x2="700" y2="410" stroke="#000" stroke-opacity="0" stroke-width="20"/><text x="490" y="442" font-size="16" text-anchor="middle" fill="#1f2024">Effort arm</text></g>
<text x="400" y="476" font-size="13" font-style="italic" text-anchor="middle" fill="#6b7280">Here the effort arm is three times as long as the load arm</text>
